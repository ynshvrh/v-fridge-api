syntax = "proto3";

package vchef.v1;

option go_package = "github.com/ynshvrh/V-Chef/proto/v1;vchefv1";
option csharp_namespace = "VFridge.Api.Protos.V1";

service ChefService {
  rpc GenerateRecipe (GenerateRecipeRequest) returns (GenerateRecipeResponse);
  rpc Chat (ChatRequest) returns (ChatResponse);
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
}

message GenerateRecipeRequest {
  repeated string ingredients = 1;
  string meal_type = 2;
  string dietary_category = 3;
  int32 max_prep_time_mins = 4;
  int32 target_calories = 5;
}

message RecipeIngredient {
  string name = 1;
  double quantity = 2;
  string unit = 3;
  bool in_fridge = 4;
  string category = 5;
}

message GenerateRecipeResponse {
  string title = 1;
  string description = 2;
  int32 prep_time_mins = 3;
  int32 cook_time_mins = 4;
  int32 servings = 5;
  int32 calories = 6;
  double protein_grams = 7;
  double fat_grams = 8;
  double carbs_grams = 9;
  repeated RecipeIngredient ingredients = 10;
  repeated string steps = 11;
  string generated_at = 12;
}

message ChatHistoryItem {
  string role = 1;
  string content = 2;
}

message ChatRequest {
  repeated ChatHistoryItem history = 1;
  string message = 2;
  repeated string inventory = 3;
  string language = 4;
  string cuisine_preference = 5;
  string dietary_profile = 6;
}

message ChatResponse {
  string reply = 1;
  GenerateRecipeResponse recipe = 2;
  repeated RecipeIngredient shopping_suggestions = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
}
